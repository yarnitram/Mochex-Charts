services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: mochex-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8090/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  mochex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mochex-workstation
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      - "3018:3018"
    environment:
      - NODE_ENV=production
      - PORT=3018
      - POCKETBASE_URL=http://pocketbase:8090
      - NEXT_PUBLIC_POCKETBASE_URL=http://localhost:8090
      - MOCHEX_DATA_DIR=/app/.data
    volumes:
      - mochex_data:/app/.data
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1500M

volumes:
  mochex_data:
